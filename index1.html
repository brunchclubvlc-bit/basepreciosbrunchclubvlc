    // INDEXEDDB (mismo código que funciona)
    let db;
    const DB_NAME = "BrunchClubDB";
    const DB_VERSION = 2;

    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => { db = request.result; resolve(db); };
            request.onupgradeneeded = (e) => {
                db = e.target.result;
                if (!db.objectStoreNames.contains("proveedores")) db.createObjectStore("proveedores", { keyPath: "id" });
                if (!db.objectStoreNames.contains("productos")) db.createObjectStore("productos", { keyPath: "id" });
                if (!db.objectStoreNames.contains("precios")) db.createObjectStore("precios", { keyPath: "id" });
            };
        });
    }

    async function saveAllData() {
        if (!db) await openDB();
        const tx = db.transaction(["proveedores", "productos", "precios"], "readwrite");
        proveedores.forEach(p => tx.objectStore("proveedores").put(p));
        productos.forEach(p => tx.objectStore("productos").put(p));
        precios.forEach(p => tx.objectStore("precios").put(p));
        return tx.done;
    }

    async function loadAllData() {
        if (!db) await openDB();
        const storedProveedores = await getAllFromStore("proveedores");
        const storedProductos = await getAllFromStore("productos");
        const storedPrecios = await getAllFromStore("precios");
        if (storedProveedores.length) proveedores = storedProveedores;
        if (storedProductos.length) productos = storedProductos;
        if (storedPrecios.length) precios = storedPrecios;
        if (!storedProductos.length) await saveAllData();
        renderDashboard();
        renderTabs();
    }

    function getAllFromStore(storeName) {
        return new Promise((resolve) => {
            const tx = db.transaction(storeName, "readonly");
            const store = tx.objectStore(storeName);
            const request = store.getAll();
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => resolve([]);
        });
    }

    async function eliminarProducto(idProducto) {
        if (!confirm("¿Eliminar producto y TODOS sus precios?")) return;
        productos = productos.filter(p => p.id !== idProducto);
        precios = precios.filter(p => p.productoId !== idProducto);
        await saveAllData();
        renderProductos();
        renderDashboard();
    }

    function renderDashboard() {
        document.getElementById("totalProveedores").innerText = proveedores.length;
        document.getElementById("totalProductos").innerText = productos.length;
        document.getElementById("totalRegistros").innerText = precios.length;
        document.getElementById("totalVariaciones").innerText = "0";
        const ultimos = [...precios].sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).slice(0,8);
        let html = `<div class="dashboard-card p-6 mb-6"><h2 class="font-bold text-xl mb-4">📋 Últimos precios</h2><div class="overflow-x-auto"><table class="min-w-full"><thead><tr class="border-b"><th class="text-left p-2">Producto</th><th class="text-left p-2">Proveedor</th><th class="text-left p-2">Sin IVA</th><th class="text-left p-2">Con IVA</th><th class="text-left p-2">Fecha</th></tr></thead><tbody>`;
        for (let p of ultimos) {
            const prod = productos.find(pr => pr.id === p.productoId);
            if (!prod) continue;
            const prov = proveedores.find(pv => pv.id === p.proveedorId);
            const conIva = getPrecioConIVA(p.precioSinIVA, prod.ivaPorcentaje);
            html += `<tr class="border-b"><td class="p-2">${prod.nombre}</td><td class="p-2">${prov?.nombre || "?"}</td><td class="p-2">${p.precioSinIVA.toFixed(2)}€</td><td class="p-2">${conIva.toFixed(2)}€</td><td class="p-2">${p.fecha}</td></tr>`;
        }
        html += `</tbody>}</div></div>`;
        document.getElementById("contenidoPrincipal").innerHTML = html;
    }

    function renderProveedores() {
        let html = `<div class="dashboard-card p-6"><div class="flex justify-between mb-4"><h2 class="font-bold text-xl">Proveedores</h2><button id="nuevoProveedorBtn" class="btn-primary">+ Nuevo</button></div><div class="grid gap-2">`;
        proveedores.forEach(prov => {
            html += `<div class="border rounded-xl p-3 flex justify-between items-center">
                        <div><span class="font-medium">${prov.nombre}</span><p class="text-xs text-gray-500">${prov.contacto || "Sin contacto"}</p></div>
                        <div>
                            <button class="btn-edit editarProvBtn" data-id="${prov.id}">Editar</button>
                            <button class="btn-danger eliminarProvBtn" data-id="${prov.id}">Eliminar</button>
                        </div>
                     </div>`;
        });
        html += `</div></div>`;
        document.getElementById("contenidoPrincipal").innerHTML = html;
        document.getElementById("nuevoProveedorBtn")?.addEventListener("click", async () => {
            let nombre = prompt("Nombre del proveedor:");
            if (nombre) { proveedores.push({ id: genId(), nombre, contacto: "" }); await saveAllData(); renderProveedores(); renderDashboard(); }
        });
        document.querySelectorAll(".editarProvBtn").forEach(btn => btn.addEventListener("click", () => editarProveedor(btn.dataset.id)));
        document.querySelectorAll(".eliminarProvBtn").forEach(btn => btn.addEventListener("click", async () => {
            if (confirm("¿Eliminar proveedor?")) { proveedores = proveedores.filter(p => p.id !== btn.dataset.id); await saveAllData(); renderProveedores(); renderDashboard(); }
        }));
    }

    function renderProductos() {
        let html = `<div class="dashboard-card p-6"><div class="flex justify-between mb-4 flex-wrap gap-2"><h2 class="font-bold text-xl">Productos</h2><div><button id="nuevoProductoBtn" class="btn-primary mr-2">+ Nuevo</button><button id="importCsvBtn" class="btn-outline">📂 Importar CSV</button><button id="descargarPlantillaBtn" class="btn-outline ml-2">📄 Plantilla CSV</button></div></div><input type="text" id="buscarProducto" placeholder="🔍 Buscar..." class="search-input mb-4"><div class="overflow-x-auto"><table class="min-w-full"><thead><tr class="border-b"><th class="text-left p-2">Producto</th><th class="text-left p-2">Proveedor</th><th class="text-left p-2">Sin IVA</th><th class="text-left p-2">Con IVA</th><th class="text-left p-2">IVA</th><th class="text-left p-2">Acciones</th></tr></thead><tbody id="tablaProductosBody">`;
        for (let prod of productos) {
            const precioObj = precios.filter(p => p.productoId === prod.id).sort((a,b) => new Date(b.fecha) - new Date(a.fecha))[0];
            const proveedor = proveedores.find(pv => pv.id === prod.proveedorId);
            const sinIVA = precioObj ? precioObj.precioSinIVA : 0;
            const conIVA = getPrecioConIVA(sinIVA, prod.ivaPorcentaje);
            html += `<tr><td class="p-2">${prod.nombre}</td><td class="p-2">${proveedor?.nombre || "?"}</td><td class="p-2">${sinIVA.toFixed(2)}€</td><td class="p-2">${conIVA.toFixed(2)}€</td><td class="p-2">${prod.ivaPorcentaje}%</td><td class="p-2"><button class="btn-edit editarProductoBtn" data-id="${prod.id}">Editar</button><button class="btn-danger eliminarProductoBtn ml-1" data-id="${prod.id}">Eliminar</button></td></tr>`;
        }
        html += `</tbody>}</div></div>`;
        document.getElementById("contenidoPrincipal").innerHTML = html;
        document.getElementById("buscarProducto")?.addEventListener("input", (e) => {
            const texto = e.target.value.toLowerCase();
            document.querySelectorAll("#tablaProductosBody tr").forEach(row => {
                const nombre = row.cells[0].innerText.toLowerCase();
                row.style.display = nombre.includes(texto) ? "" : "none";
            });
        });
        document.querySelectorAll(".editarProductoBtn").forEach(btn => btn.addEventListener("click", () => editarProducto(btn.dataset.id)));
        document.querySelectorAll(".eliminarProductoBtn").forEach(btn => btn.addEventListener("click", () => eliminarProducto(btn.dataset.id)));
        document.getElementById("nuevoProductoBtn")?.addEventListener("click", async () => {
            const nombre = prompt("Nombre:");
            if (!nombre) return;
            const categoria = prompt("Categoría:") || "General";
            const proveedorNombre = prompt("Proveedor:") || "Mercadona";
            let prov = proveedores.find(p => p.nombre === proveedorNombre);
            if (!prov) { prov = { id: genId(), nombre: proveedorNombre, contacto: "" }; proveedores.push(prov); }
            const iva = parseInt(prompt("IVA %:", "21"));
            const precio = parseFloat(prompt("Precio sin IVA:"));
            addProducto(nombre, categoria, "unidad", isNaN(iva)?21:iva, prov.id, isNaN(precio)?0:precio, new Date().toISOString().slice(0,10), "");
            await saveAllData();
            renderProductos();
            renderDashboard();
        });
        document.getElementById("importCsvBtn")?.addEventListener("click", () => {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = ".csv";
            input.onchange = async (e) => {
                const file = e.target.files[0];
                const text = await file.text();
                const lines = text.split("\n");
                const headers = lines[0].split(",").map(h => h.trim().toLowerCase());
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    const values = lines[i].split(",");
                    let row = {};
                    headers.forEach((h, idx) => row[h] = values[idx] ? values[idx].trim() : "");
                    if (!row.nombre) continue;
                    let prov = proveedores.find(p => p.nombre === (row.proveedor || "Mercadona"));
                    if (!prov) prov = { id: genId(), nombre: row.proveedor, contacto: "" };
                    let iva = row.iva_porcentaje ? parseInt(row.iva_porcentaje) : 21;
                    addProducto(row.nombre, row.categoria || "General", row.unidad || "unidad", iva, prov.id, parseFloat(row.precio_sin_iva) || 0, row.fecha || new Date().toISOString().slice(0,10), row.notas || "");
                }
                await saveAllData();
                alert("Importación completada");
                renderProductos();
                renderDashboard();
            };
            input.click();
        });
        document.getElementById("descargarPlantillaBtn")?.addEventListener("click", () => {
            const csv = "nombre,categoria,proveedor,precio_sin_iva,iva_porcentaje,fecha,notas,unidad\nEjemplo: Aceite de oliva,Aceites,Mercadona,4.50,10,2026-04-12,\"buen precio\",\"1L\"";
            const blob = new Blob([csv], { type: "text/csv" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "plantilla_productos.csv";
            a.click();
        });
    }

    function renderRegistrar() {
        let html = `<div class="dashboard-card p-6"><h2 class="font-bold text-xl mb-4">💰 Registrar precio</h2><div class="grid gap-4 max-w-md"><select id="prodSelect" class="border rounded-xl p-2"><option value="">Producto</option>${productos.map(p => `<option value="${p.id}">${p.nombre}</option>`).join("")}</select><select id="provSelect" class="border rounded-xl p-2"><option value="">Proveedor</option>${proveedores.map(pv => `<option value="${pv.id}">${pv.nombre}</option>`).join("")}</select><input type="number" id="precioInput" placeholder="Precio SIN IVA (€)" step="0.01" class="border rounded-xl p-2"><input type="date" id="fechaInput" value="${new Date().toISOString().slice(0,10)}" class="border rounded-xl p-2"><textarea id="notaInput" placeholder="Nota especial" class="border rounded-xl p-2"></textarea><button id="guardarPrecioBtn" class="btn-primary">Guardar</button></div></div>`;
        document.getElementById("contenidoPrincipal").innerHTML = html;
        document.getElementById("guardarPrecioBtn")?.addEventListener("click", async () => {
            const prodId = document.getElementById("prodSelect").value;
            const provId = document.getElementById("provSelect").value;
            const precio = parseFloat(document.getElementById("precioInput").value);
            const fecha = document.getElementById("fechaInput").value;
            const nota = document.getElementById("notaInput").value;
            if (!prodId || !provId || isNaN(precio)) { alert("Completa todos los campos"); return; }
            precios.push({ id: genId(), productoId: prodId, proveedorId: provId, precioSinIVA: precio, fecha, notaEspecial: nota });
            await saveAllData();
            alert("Precio guardado");
            renderRegistrar();
            renderDashboard();
        });
    }

    function renderComparador() {
        let html = `<div class="dashboard-card p-6"><h2 class="font-bold text-xl mb-4">🔍 Comparador</h2><input type="text" id="buscarComparador" placeholder="Buscar producto..." class="search-input mb-4"><div id="resultadoComparacion" class="grid gap-4"></div></div>`;
        document.getElementById("contenidoPrincipal").innerHTML = html;
        document.getElementById("buscarComparador")?.addEventListener("input", (e) => {
            const texto = e.target.value.toLowerCase();
            const filtrados = productos.filter(p => p.nombre.toLowerCase().includes(texto));
            let res = `<div class="grid gap-4">`;
            for (let prod of filtrados.slice(0, 20)) {
                const preciosProd = precios.filter(p => p.productoId === prod.id).sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
                if (preciosProd.length === 0) continue;
                res += `<div class="border rounded-xl p-4"><h3 class="font-bold">${prod.nombre}</h3>`;
                for (let pp of preciosProd) {
                    const prov = proveedores.find(pv => pv.id === pp.proveedorId);
                    const conIva = getPrecioConIVA(pp.precioSinIVA, prod.ivaPorcentaje);
                    res += `<div class="flex justify-between text-sm border-b py-1"><span>${prov?.nombre}</span><span>${pp.precioSinIVA.toFixed(2)}€ sin IVA / ${conIva.toFixed(2)}€ con IVA (${prod.ivaPorcentaje}%)</span><span>${pp.fecha}</span></div>`;
                }
                res += `</div>`;
            }
            res += `</div>`;
            document.getElementById("resultadoComparacion").innerHTML = res;
        });
    }

    let evolutionChart = null;
    function renderHistoricos() {
        let html = `<div class="dashboard-card p-6"><h2 class="font-bold text-xl mb-4">📈 Evolución de precios</h2><select id="selectProductoEvo" class="border rounded-xl p-2 w-full mb-4"><option value="">Selecciona un producto</option>${productos.map(p => `<option value="${p.id}">${p.nombre}</option>`).join("")}</select><canvas id="priceChart" class="w-full h-64"></canvas><div id="detalleEvo" class="mt-4 text-sm"></div></div>`;
        document.getElementById("contenidoPrincipal").innerHTML = html;
        document.getElementById("selectProductoEvo")?.addEventListener("change", () => {
            const prodId = document.getElementById("selectProductoEvo").value;
            if (!prodId) return;
            const prod = productos.find(p => p.id === prodId);
            const preciosProd = precios.filter(p => p.productoId === prodId).sort((a,b) => new Date(a.fecha) - new Date(b.fecha));
            if (preciosProd.length === 0) { alert("Sin datos históricos"); return; }
            const fechas = preciosProd.map(p => p.fecha);
            const valores = preciosProd.map(p => p.precioSinIVA);
            if (evolutionChart) evolutionChart.destroy();
            const ctx = document.getElementById("priceChart").getContext("2d");
            evolutionChart = new Chart(ctx, {
                type: 'line',
                data: { labels: fechas, datasets: [{ label: `${prod.nombre} (€ sin IVA)`, data: valores, borderColor: '#8B5E3C', tension: 0.2 }] },
                options: { responsive: true, maintainAspectRatio: true }
            });
            document.getElementById("detalleEvo").innerHTML = `Último: ${valores[valores.length-1].toFixed(2)}€ · Máx: ${Math.max(...valores).toFixed(2)}€ · Mín: ${Math.min(...valores).toFixed(2)}€`;
        });
    }

    function renderTabs() {
        const btns = document.querySelectorAll(".tab-btn");
        btns.forEach(btn => {
            btn.addEventListener("click", () => {
                btns.forEach(b => b.classList.remove("tab-active", "tab-inactive"));
                btn.classList.add("tab-active");
                btn.classList.remove("tab-inactive");
                const tab = btn.dataset.tab;
                if (tab === "dashboard") renderDashboard();
                if (tab === "proveedores") renderProveedores();
                if (tab === "productos") renderProductos();
                if (tab === "registrar") renderRegistrar();
                if (tab === "comparador") renderComparador();
                if (tab === "historicos") renderHistoricos();
            });
        });
        renderDashboard();
    }

    document.getElementById("themeToggle")?.addEventListener("click", () => {
        document.body.classList.toggle("dark");
        localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    });
    if (localStorage.getItem("theme") === "dark") document.body.classList.add("dark");

    document.getElementById("exportBtn")?.addEventListener("click", () => {
        const data = { proveedores, productos, precios };
        const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "brunch_club_backup.json";
        a.click();
    });
    document.getElementById("importBtn")?.addEventListener("click", () => document.getElementById("importFile").click());
    document.getElementById("importFile")?.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
            const data = JSON.parse(ev.target.result);
            proveedores = data.proveedores;
            productos = data.productos;
            precios = data.precios;
            await saveAllData();
            location.reload();
        };
        reader.readAsText(file);
    });

    window.onload = async () => {
        await openDB();
        await loadAllData();
    };
</script>
</body>
</html>
